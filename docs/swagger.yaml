basePath: /
definitions:
  dto.ConfirmResetRequest:
    properties:
      code:
        type: string
      email:
        type: string
      new_password:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.StartResetDevResponse:
    properties:
      dev_code:
        type: string
    type: object
  dto.StartResetRequest:
    properties:
      email:
        type: string
    type: object
  dto.TokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  dto.ValidateResponse:
    properties:
      claims:
        additionalProperties: {}
        type: object
      exp_at:
        type: string
      iss:
        type: string
      sub:
        type: string
    type: object
info:
  contact: {}
  description: Сервис аутентификации Enduran (регистрация, логин, refresh, сброс пароля)
  title: Enduran Auth API
  version: "1.0"
paths:
  /auth/v1/login:
    post:
      consumes:
      - application/json
      description: Проверяет email/пароль и возвращает пару access/refresh токенов
      parameters:
      - description: Учётные данные пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TokenResponse'
        "400":
          description: Неверный формат запроса
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Неверные учётные данные
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Пользователь заблокирован
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Логин пользователя
      tags:
      - auth
  /auth/v1/logout:
    post:
      consumes:
      - application/json
      description: Помечает переданный refresh-токен как отозванный. Идемпотентен.
      parameters:
      - description: Refresh токен (опционально)
        in: body
        name: request
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Успешный логаут, тело отсутствует
          schema:
            type: string
        "400":
          description: Неверный формат запроса
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Логаут с одного устройства
      tags:
      - auth
  /auth/v1/password/reset/confirm:
    post:
      consumes:
      - application/json
      description: Проверяет OTP-код, устанавливает новый пароль и инвалидирует все
        refresh-токены пользователя
      parameters:
      - description: Email, OTP-код и новый пароль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ConfirmResetRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Пароль успешно изменён, тело отсутствует
          schema:
            type: string
        "400":
          description: Неверный код или некорректные данные
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Подтверждение сброса пароля
      tags:
      - password-reset
  /auth/v1/password/reset/start:
    post:
      consumes:
      - application/json
      description: Генерирует одноразовый код для сброса пароля и сохраняет его. В
        dev-режиме возвращает код в ответе.
      parameters:
      - description: Email пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.StartResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'Dev-режим: OTP-код в ответе'
          schema:
            $ref: '#/definitions/dto.StartResetDevResponse'
        "204":
          description: 'В проде: всегда 204, даже если email не найден'
          schema:
            type: string
        "400":
          description: Неверный формат запроса
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Начало сброса пароля
      tags:
      - password-reset
  /auth/v1/refresh:
    post:
      consumes:
      - application/json
      description: Принимает refresh-токен и возвращает новую пару access/refresh
        (rotation)
      parameters:
      - description: Refresh токен
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TokenResponse'
        "400":
          description: Неверный формат запроса
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Невалидный или просроченный refresh-токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Обновление токенов
      tags:
      - auth
  /auth/v1/register:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя и возвращает пару access/refresh токенов
      parameters:
      - description: Учётные данные пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.TokenResponse'
        "400":
          description: Неверный формат запроса
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Пользователь с таким email уже существует
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Регистрация пользователя
      tags:
      - auth
  /auth/v1/validate:
    get:
      consumes:
      - application/json
      description: Парсит и проверяет JWT access-токен, возвращает subject, issuer,
        время истечения и все клеймы
      parameters:
      - default: Bearer <token>
        description: Bearer access токен
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ValidateResponse'
        "401":
          description: Нет токена или он невалиден
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Валидация access-токена
      tags:
      - auth
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
